name: publish-cli
run-name: "cli ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump when no explicit version is given"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Override version (optional, e.g. 1.18.23)"
        required: false
        type: string

concurrency: publish-cli-${{ github.ref }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Bump version
        run: |
          override='${{ inputs.version }}'
          bump='${{ inputs.bump }}'
          current=$(bun -e 'console.log((await Bun.file("packages/cli/package.json").json()).version)')
          if [ -n "$override" ]; then
            next="$override"
          else
            IFS=. read -r major minor patch <<< "${current%%-*}"
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Bumping $current -> $next"
          VERSION="$next" bun -e 'const path = "packages/cli/package.json"; const pkg = await Bun.file(path).json(); pkg.version = process.env.VERSION; await Bun.write(path, JSON.stringify(pkg, null, 2) + "\n")'
          echo "VERSION=$next" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(cli): bump to $next" --no-verify
          git pull --rebase origin main
          git push --no-verify

      - name: Build CLI binaries
        # Ship the same entrypoint `bun dev` runs (packages/novacode), not the
        # slim packages/cli surface, so npm users get the full CLI.
        run: bun run ./packages/novacode/script/build.ts
        env:
          NOVACODE_CHANNEL: latest
          NOVACODE_VERSION: ${{ env.VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: bun run ./packages/cli/script/publish.ts
        env:
          NOVACODE_CHANNEL: latest
          NOVACODE_VERSION: ${{ env.VERSION }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
